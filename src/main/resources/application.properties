
spring.application.name=aiarchaeologistbackend

server.port=${PORT:8081}

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:ai_archaeologist;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root 
spring.datasource.password=akshaya2006

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Frontend
app.frontend.url=https://ai-archaeologist-frontend.onrender.com

# Artifact Upload Directory
app.upload.dir=/tmp/uploads
