<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Archaeologist - Upload Artifact</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f1ea;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #5a3e2b;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input,
        textarea,
        button {
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 25px;
            background: #5a3e2b;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #3f2b1e;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
            border-radius: 6px;
            background: #f1f1f1;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Archaeologist</h1>

    <label>Select Artifact Image</label>
    <input type="file" id="file" accept="image/*">

    <label>Artifact Type</label>
    <input type="text" id="artifactType" value="Pottery">

    <label>Description</label>
    <textarea id="description">Ancient pottery artifact</textarea>

    <button onclick="uploadArtifact()">
        Upload Artifact
    </button>

    <div id="result"></div>

</div>

<script>

async function uploadArtifact() {

    const fileInput = document.getElementById("file");
    const artifactType = document.getElementById("artifactType").value;
    const description = document.getElementById("description").value;
    const result = document.getElementById("result");

    if (fileInput.files.length === 0) {
        result.innerText = "Please select an image first.";
        return;
    }

    const formData = new FormData();

    formData.append("file", fileInput.files[0]);
    formData.append("artifactType", artifactType);
    formData.append("description", description);

    result.innerText = "Uploading...";

    try {

        const response = await fetch(
            "http://localhost:8081/api/artifacts/upload",
            {
                method: "POST",
                body: formData
            }
        );

        const data = await response.json();

        if (response.ok) {
            result.innerText =
                "Upload successful!\n\n" +
                JSON.stringify(data, null, 2);
        } else {
            result.innerText =
                "Upload failed.\n\n" +
                JSON.stringify(data, null, 2);
        }

    } catch (error) {

        result.innerText =
            "Error connecting to Spring Boot:\n\n" +
            error;
    }
}

</script>

</body>
</html>
